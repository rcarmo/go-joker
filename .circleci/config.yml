version: 2
jobs:
  build:
    docker:
      - image: cimg/go:1.27.1
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Project environment
          command: |
            source scripts/project-env.sh
            echo "export PROJECT_TMP_ROOT=\"$PROJECT_TMP_ROOT\"" >> "$BASH_ENV"
            echo 'source "$PWD/scripts/project-env.sh"' >> "$BASH_ENV"
      - run:
          name: Dependencies and CLI
          command: make deps cli
      - run:
          name: Interpreter fixtures
          command: make interpreter-fixtures
