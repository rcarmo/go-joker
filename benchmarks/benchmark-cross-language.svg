  <g transform="translate(40,690)">
    <text class="muted n" x="0" y="14">All values ms/op, 5 iterations, i7-12700. ⚡ = WASM native via wazero. Dashed line separates wins from losses.</text>
    <text class="muted n" x="0" y="32">Above line: Joker beats Goja (pure computation → WASM). Below: persistent data structure overhead limits gains.</text>
    <text class="muted n" x="0" y="50">Stack: IR bytecode (26 opcodes) + WASM/wazero + TCO rewrite + transient vectors + compiled fn dispatch + host fn infra.</text>
