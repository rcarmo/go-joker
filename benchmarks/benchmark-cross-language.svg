<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Cross-language benchmark matrix</title>
  <desc id="desc">Heatmap matrix comparing Bun/JSC, Python, Goja, and Joker across all CLBG + micro benchmarks. Cell color = relative speed.</desc>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f8fc; --panel: #fff; --border: #c7d3ea;
      --text: #172033; --muted: #6b7a96; --head: #e8edf5;
      --fast: #22a566; --mid: #f5a623; --slow: #e04848; --na: #e2e8f2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1020; --panel: #11182b; --border: #25324f;
        --text: #e3ecff; --muted: #8da0c4; --head: #182240;
        --fast: #2dbd72; --mid: #d4952a; --slow: #c93e3e; --na: #1a2540;
      }
    }
    svg { background: var(--bg); }
    .panel { fill: var(--panel); stroke: var(--border); stroke-width: 1; }
    .head { fill: var(--head); }
    .text { fill: var(--text); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .muted { fill: var(--muted); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .white { fill: #fff; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .title { font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 13px; font-weight: 500; }
    .colhead { font-size: 14px; font-weight: 700; }
    .rowhead { font-size: 12px; font-weight: 600; }
    .cell { font-size: 11px; font-weight: 600; }
    .tiny { font-size: 9px; font-weight: 500; }
    .note { font-size: 11px; }
  </style>

  <rect x="0" y="0" width="1200" height="820" fill="var(--bg)" />
  <rect class="panel" x="20" y="20" width="1160" height="780" rx="14" />

  <text class="text title" x="44" y="58">Cross-language benchmark matrix</text>
  <text class="muted subtitle" x="44" y="78">All times in ms/op. Cell color: 🟢 fastest in row → 🟡 mid → 🔴 slowest. Sorted by Joker/Goja ratio.</text>

  <!-- Column headers -->
  <g transform="translate(40,100)">
    <rect class="head" x="220" y="0" width="180" height="32" rx="6" />
    <rect class="head" x="410" y="0" width="180" height="32" rx="6" />
    <rect class="head" x="600" y="0" width="180" height="32" rx="6" />
    <rect class="head" x="790" y="0" width="180" height="32" rx="6" />
    <rect class="head" x="980" y="0" width="160" height="32" rx="6" />
    <text class="text colhead" x="310" y="22" text-anchor="middle">Bun/JSC</text>
    <text class="text colhead" x="500" y="22" text-anchor="middle">Python 3.13</text>
    <text class="text colhead" x="690" y="22" text-anchor="middle">Goja</text>
    <text class="text colhead" x="880" y="22" text-anchor="middle">Joker</text>
    <text class="text colhead" x="1060" y="22" text-anchor="middle">Joker/Goja</text>
  </g>

  <!-- Data rows. 15 benchmarks × 38px each, starting at y=142 -->
  <!-- Row colors: interpolate from green (fastest) to red (slowest) per row -->

  <!-- Helper: each row has 5 cells. The ms values determine cell colors. -->
  <!-- I'll use opacity-based coloring: fast=green bg, slow=red bg -->

  <!-- Row 1: pidigits — Joker wins -->
  <g transform="translate(40,142)">
    <text class="text rowhead" x="0" y="18">pidigits</text>
    <rect fill="#22a566" opacity="0.3" x="220" y="0" width="180" height="34" rx="4" />
    <rect fill="#f5a623" opacity="0.3" x="410" y="0" width="180" height="34" rx="4" />
    <rect fill="#e04848" opacity="0.3" x="600" y="0" width="180" height="34" rx="4" />
    <rect fill="#22a566" opacity="0.4" x="790" y="0" width="180" height="34" rx="4" />
    <rect fill="#22a566" opacity="0.5" x="980" y="0" width="160" height="34" rx="4" />
    <text class="text cell" x="310" y="18" text-anchor="middle">0.02</text>
    <text class="text cell" x="500" y="18" text-anchor="middle">0.05</text>
    <text class="text cell" x="690" y="18" text-anchor="middle">0.15</text>
    <text class="text cell" x="880" y="18" text-anchor="middle">0.052</text>
    <text class="white cell" x="1060" y="18" text-anchor="middle">0.35× ✅</text>
  </g>

  <!-- Row 2: regex-redux -->
  <g transform="translate(40,178)">
    <text class="text rowhead" x="0" y="18">regex-redux</text>
    <rect fill="#22a566" opacity="0.3" x="220" y="0" width="180" height="34" rx="4" />
    <rect fill="#f5a623" opacity="0.3" x="410" y="0" width="180" height="34" rx="4" />
    <rect fill="#e04848" opacity="0.3" x="600" y="0" width="180" height="34" rx="4" />
    <rect fill="#f5a623" opacity="0.3" x="790" y="0" width="180" height="34" rx="4" />
    <rect fill="#f5a623" opacity="0.4" x="980" y="0" width="160" height="34" rx="4" />
    <text class="text cell" x="310" y="18" text-anchor="middle">0.06</text>
    <text class="text cell" x="500" y="18" text-anchor="middle">0.09</text>
    <text class="text cell" x="690" y="18" text-anchor="middle">0.14</text>
    <text class="text cell" x="880" y="18" text-anchor="middle">0.086</text>
    <text class="text cell" x="1060" y="18" text-anchor="middle">0.61×</text>
  </g>

  <!-- Row 3: arithmetic loop — WASM! -->
  <g transform="translate(40,214)">
    <text class="text rowhead" x="0" y="18">arithmetic loop ⚡</text>
    <rect fill="#f5a623" opacity="0.3" x="220" y="0" width="180" height="34" rx="4" />
    <rect fill="#e04848" opacity="0.3" x="410" y="0" width="180" height="34" rx="4" />
    <rect fill="#e04848" opacity="0.4" x="600" y="0" width="180" height="34" rx="4" />
    <rect fill="#22a566" opacity="0.4" x="790" y="0" width="180" height="34" rx="4" />
    <rect fill="#22a566" opacity="0.5" x="980" y="0" width="160" height="34" rx="4" />
    <text class="text cell" x="310" y="18" text-anchor="middle">0.38</text>
    <text class="text cell" x="500" y="18" text-anchor="middle">7.31</text>
    <text class="text cell" x="690" y="18" text-anchor="middle">18.77</text>
    <text class="text cell" x="880" y="14" text-anchor="middle">0.32</text>
    <text class="muted tiny" x="880" y="26" text-anchor="middle">WASM native</text>
    <text class="white cell" x="1060" y="18" text-anchor="middle">0.02× ✅</text>
  </g>

  <!-- Row 4: recursive fib -->
  <g transform="translate(40,250)">
    <text class="text rowhead" x="0" y="18">recursive fib</text>
    <rect fill="#22a566" opacity="0.3" x="220" y="0" width="180" height="34" rx="4" />
    <rect fill="#f5a623" opacity="0.3" x="410" y="0" width="180" height="34" rx="4" />
    <rect fill="#e04848" opacity="0.3" x="600" y="0" width="180" height="34" rx="4" />
    <rect fill="#e04848" opacity="0.2" x="790" y="0" width="180" height="34" rx="4" />
    <rect fill="#f5a623" opacity="0.4" x="980" y="0" width="160" height="34" rx="4" />
    <text class="text cell" x="310" y="18" text-anchor="middle">0.98</text>
    <text class="text cell" x="500" y="18" text-anchor="middle">20.67</text>
    <text class="text cell" x="690" y="18" text-anchor="middle">80.41</text>
    <text class="text cell" x="880" y="18" text-anchor="middle">99.8</text>
    <text class="text cell" x="1060" y="18" text-anchor="middle">1.24×</text>
  </g>

  <!-- Row 5: binary-trees -->
  <g transform="translate(40,286)">
    <text class="text rowhead" x="0" y="18">binary-trees</text>
    <rect fill="#22a566" opacity="0.3" x="220" y="0" width="180" height="34" rx="4" />
    <rect fill="#f5a623" opacity="0.3" x="410" y="0" width="180" height="34" rx="4" />
    <rect fill="#e04848" opacity="0.2" x="600" y="0" width="180" height="34" rx="4" />
    <rect fill="#e04848" opacity="0.3" x="790" y="0" width="180" height="34" rx="4" />
    <rect fill="#f5a623" opacity="0.4" x="980" y="0" width="160" height="34" rx="4" />
    <text class="text cell" x="310" y="18" text-anchor="middle">5.68</text>
    <text class="text cell" x="500" y="18" text-anchor="middle">54.24</text>
    <text class="text cell" x="690" y="18" text-anchor="middle">172.3</text>
    <text class="text cell" x="880" y="18" text-anchor="middle">431.4</text>
    <text class="text cell" x="1060" y="18" text-anchor="middle">2.5×</text>
  </g>

  <!-- Row 6: fannkuch -->
  <g transform="translate(40,322)">
    <text class="text rowhead" x="0" y="18">fannkuch-redux</text>
    <rect fill="#22a566" opacity="0.3" x="220" y="0" width="180" height="34" rx="4" />
    <rect fill="#f5a623" opacity="0.3" x="410" y="0" width="180" height="34" rx="4" />
