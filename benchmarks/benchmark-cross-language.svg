<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Cross-language benchmark matrix</title>
  <desc id="desc">Heatmap: Bun/JSC, Python, Goja, Joker across all benchmarks. Sorted by Joker/Goja ratio.</desc>
  <style>
    :root { color-scheme: light dark;
      --bg:#f6f8fc;--panel:#fff;--border:#c7d3ea;--text:#172033;--muted:#6b7a96;--head:#e8edf5;
      --f:#22a566;--m:#f5a623;--s:#e04848; }
    @media(prefers-color-scheme:dark){ :root {
      --bg:#0b1020;--panel:#11182b;--border:#25324f;--text:#e3ecff;--muted:#8da0c4;--head:#182240;
      --f:#2dbd72;--m:#d4952a;--s:#c93e3e; }}
    svg{background:var(--bg)}.panel{fill:var(--panel);stroke:var(--border)}.head{fill:var(--head)}
    .text{fill:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .muted{fill:var(--muted);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .w{fill:#fff;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .title{font-size:22px;font-weight:700}.sub{font-size:13px;font-weight:500}
    .ch{font-size:13px;font-weight:700}.rh{font-size:11px;font-weight:600}
    .c{font-size:11px;font-weight:600}.t{font-size:9px;font-weight:500}.n{font-size:11px}
  </style>
  <rect x="0" y="0" width="1200" height="820" fill="var(--bg)"/>
  <rect class="panel" x="20" y="20" width="1160" height="780" rx="14"/>
  <text class="text title" x="44" y="56">Cross-language benchmark matrix</text>
  <text class="muted sub" x="44" y="76">All times ms/op • Sorted by Joker/Goja ratio • ⚡ = WASM native compilation</text>

  <!-- Headers -->
  <g transform="translate(40,96)">
    <rect class="head" x="210" y="0" width="160" height="28" rx="5"/><text class="text ch" x="290" y="19" text-anchor="middle">Bun/JSC</text>
    <rect class="head" x="380" y="0" width="160" height="28" rx="5"/><text class="text ch" x="460" y="19" text-anchor="middle">Python</text>
    <rect class="head" x="550" y="0" width="160" height="28" rx="5"/><text class="text ch" x="630" y="19" text-anchor="middle">Goja</text>
    <rect class="head" x="720" y="0" width="160" height="28" rx="5"/><text class="text ch" x="800" y="19" text-anchor="middle">Joker</text>
    <rect class="head" x="890" y="0" width="80" height="28" rx="5"/><text class="text ch" x="930" y="19" text-anchor="middle">Ratio</text>
    <rect class="head" x="980" y="0" width="140" height="28" rx="5"/><text class="text ch" x="1050" y="19" text-anchor="middle">vs Baseline</text>
  </g>

  <!-- Rows: y=132, step=38 -->
