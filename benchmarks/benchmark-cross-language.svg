  <g transform="translate(40,132)">
    <text class="text rh" x="0" y="16">tail-rec sum ⚡</text>
    <rect fill="#22a566" opacity=".2" x="210" y="0" width="160" height="32" rx="4"/><text class="text c" x="290" y="18" text-anchor="middle">0.22</text>
    <rect fill="#22a566" opacity=".2" x="380" y="0" width="160" height="32" rx="4"/><text class="text c" x="460" y="18" text-anchor="middle">3.46</text>
    <rect fill="#e04848" opacity=".25" x="550" y="0" width="160" height="32" rx="4"/><text class="text c" x="630" y="18" text-anchor="middle">16.17</text>
    <rect fill="#22a566" opacity=".4" x="720" y="0" width="160" height="32" rx="4"/><text class="text c" x="800" y="18" text-anchor="middle">0.14</text>
