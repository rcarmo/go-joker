  <!-- Row 8: mandelbrot -->
  <g transform="translate(40,394)">
    <text class="text rowhead" x="0" y="18">mandelbrot</text>
    <rect fill="#22a566" opacity="0.3" x="220" y="0" width="180" height="34" rx="4" />
    <rect fill="#22a566" opacity="0.3" x="410" y="0" width="180" height="34" rx="4" />
    <rect fill="#f5a623" opacity="0.3" x="600" y="0" width="180" height="34" rx="4" />
    <rect fill="#e04848" opacity="0.3" x="790" y="0" width="180" height="34" rx="4" />
    <rect fill="#f5a623" opacity="0.4" x="980" y="0" width="160" height="34" rx="4" />
    <text class="text cell" x="310" y="18" text-anchor="middle">0.25</text>
    <text class="text cell" x="500" y="18" text-anchor="middle">4.76</text>
    <text class="text cell" x="690" y="18" text-anchor="middle">38.96</text>
    <text class="text cell" x="880" y="18" text-anchor="middle">128.3</text>
    <text class="text cell" x="1060" y="18" text-anchor="middle">3.3×</text>
  </g>

  <!-- Row 9: spectral-norm -->
  <g transform="translate(40,430)">
    <text class="text rowhead" x="0" y="18">spectral-norm</text>
    <rect fill="#22a566" opacity="0.3" x="220" y="0" width="180" height="34" rx="4" />
    <rect fill="#f5a623" opacity="0.3" x="410" y="0" width="180" height="34" rx="4" />
    <rect fill="#f5a623" opacity="0.3" x="600" y="0" width="180" height="34" rx="4" />
    <rect fill="#e04848" opacity="0.3" x="790" y="0" width="180" height="34" rx="4" />
    <rect fill="#e04848" opacity="0.3" x="980" y="0" width="160" height="34" rx="4" />
    <text class="text cell" x="310" y="18" text-anchor="middle">1.86</text>
    <text class="text cell" x="500" y="18" text-anchor="middle">24.48</text>
    <text class="text cell" x="690" y="18" text-anchor="middle">65.17</text>
