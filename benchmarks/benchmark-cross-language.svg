<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Cross-language benchmark matrix</title>
  <desc id="desc">Heatmap: Bun/JSC, Python, Goja, Joker across all benchmarks. Cell color = relative speed per row.</desc>
  <style>
    :root { color-scheme: light dark;
      --bg:#f6f8fc;--panel:#fff;--border:#c7d3ea;--text:#172033;--muted:#6b7a96;--head:#e8edf5;
      --f:#22a566;--m:#f5a623;--s:#e04848;--na:#e2e8f2; }
    @media(prefers-color-scheme:dark){ :root {
      --bg:#0b1020;--panel:#11182b;--border:#25324f;--text:#e3ecff;--muted:#8da0c4;--head:#182240;
      --f:#2dbd72;--m:#d4952a;--s:#c93e3e;--na:#1a2540; }}
    svg{background:var(--bg)}.panel{fill:var(--panel);stroke:var(--border)}.head{fill:var(--head)}
    .text{fill:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .muted{fill:var(--muted);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .w{fill:#fff;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .title{font-size:22px;font-weight:700}.sub{font-size:13px;font-weight:500}
    .ch{font-size:14px;font-weight:700}.rh{font-size:12px;font-weight:600}
    .c{font-size:11px;font-weight:600}.t{font-size:9px;font-weight:500}.n{font-size:11px}
  </style>
  <rect x="0" y="0" width="1200" height="820" fill="var(--bg)"/>
  <rect class="panel" x="20" y="20" width="1160" height="780" rx="14"/>
  <text class="text title" x="44" y="58">Cross-language benchmark matrix</text>
  <text class="muted sub" x="44" y="78">All times ms/op • Cell color: 🟢 fast → 🟡 mid → 🔴 slow per row • Sorted by Joker/Goja ratio</text>

  <!-- Headers -->
  <g transform="translate(40,100)">
    <rect class="head" x="220" y="0" width="170" height="30" rx="5"/><text class="text ch" x="305" y="21" text-anchor="middle">Bun/JSC</text>
    <rect class="head" x="400" y="0" width="170" height="30" rx="5"/><text class="text ch" x="485" y="21" text-anchor="middle">Python</text>
    <rect class="head" x="580" y="0" width="170" height="30" rx="5"/><text class="text ch" x="665" y="21" text-anchor="middle">Goja</text>
    <rect class="head" x="760" y="0" width="170" height="30" rx="5"/><text class="text ch" x="845" y="21" text-anchor="middle">Joker</text>
    <rect class="head" x="940" y="0" width="170" height="30" rx="5"/><text class="text ch" x="1025" y="21" text-anchor="middle">Joker/Goja</text>
  </g>

  <!-- Data rows: y=140, step=36 -->
  <!-- 1: arithmetic ⚡ 0.02× -->
  <g transform="translate(40,140)">
    <text class="text rh" x="0" y="18">arithmetic loop ⚡</text>
    <rect fill="#f5a623" opacity=".3" x="220" y="2" width="170" height="28" rx="4"/><text class="text c" x="305" y="20" text-anchor="middle">0.38</text>
    <rect fill="#e04848" opacity=".3" x="400" y="2" width="170" height="28" rx="4"/><text class="text c" x="485" y="20" text-anchor="middle">7.31</text>
    <rect fill="#e04848" opacity=".4" x="580" y="2" width="170" height="28" rx="4"/><text class="text c" x="665" y="20" text-anchor="middle">18.77</text>
    <rect fill="#22a566" opacity=".4" x="760" y="2" width="170" height="28" rx="4"/><text class="text c" x="845" y="14" text-anchor="middle">0.29</text><text class="muted t" x="845" y="26" text-anchor="middle">WASM</text>
    <rect fill="#22a566" opacity=".6" x="940" y="2" width="170" height="28" rx="4"/><text class="w c" x="1025" y="20" text-anchor="middle">0.02× ✅</text>
  </g>
