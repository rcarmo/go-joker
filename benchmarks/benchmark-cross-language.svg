    <text class="muted note" x="0" y="14">All values in ms/op, 5 iterations, i7-12700. ⚡ = WASM native compilation.</text>
    <text class="muted note" x="0" y="32">Cell colors: 🟢 green = fast for row, 🟡 orange = mid, 🔴 red = slowest.</text>
    <text class="muted note" x="0" y="50">Joker optimization: IR bytecode (26 opcodes) + WASM/wazero + TCO + transient vectors + compiled fn dispatch.</text>
    <text class="muted note" x="0" y="68">Sorted by Joker/Goja ratio (best first). Joker's arithmetic loop via WASM matches Bun/JSC.</text>
  </g>
</svg>
