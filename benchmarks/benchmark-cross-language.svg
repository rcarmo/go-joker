<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Cross-language benchmark matrix</title><desc id="desc">Heatmap sorted by Joker/Goja ratio.</desc>
<style>:root{color-scheme:light dark;--bg:#f6f8fc;--panel:#fff;--border:#c7d3ea;--text:#172033;--muted:#6b7a96;--head:#e8edf5}@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--panel:#11182b;--border:#25324f;--text:#e3ecff;--muted:#8da0c4;--head:#182240}}svg{background:var(--bg)}.panel{fill:var(--panel);stroke:var(--border)}.head{fill:var(--head)}.text{fill:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif}.muted{fill:var(--muted);font-family:Inter,ui-sans-serif,system-ui,sans-serif}.title{font-size:22px;font-weight:700}.sub{font-size:13px}.ch{font-size:13px;font-weight:700}.rh{font-size:11px;font-weight:600}.c{font-size:11px;font-weight:600}.t{font-size:9px}.white{fill:#fff;font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:11px;font-weight:600}</style>
