<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1388 202">
  <style>
    /* Default: light mode (for rsvg-convert and non-media-query agents) */
    .bg { fill: transparent; }
    .box { fill: #ffffff; stroke: #707070; stroke-width: 1.5; }
    .box-accent { fill: #dbeafe; stroke: #3b82f6; stroke-width: 1.5; }
    .box-green { fill: #74a7ff; stroke: #012f7b; stroke-width: 1.5; }
    .box-warm { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
    .box-purple { fill: #adadad; stroke: #000000; stroke-width: 1.5; }
    .box-teal { fill: #ebebeb; stroke: #474747; stroke-width: 1.5; }
    .box-slate { fill: #a7c6ff; stroke: #0042a9; stroke-width: 1.5; }
    .box-indigo { fill: #dfeed4; stroke: #4e7a27; stroke-width: 1.5; }
    .box-rose { fill: #dfeed4; stroke: #76bb40; stroke-width: 1.5; }
    .box-orange { fill: #ffedd5; stroke: #ea580c; stroke-width: 1.5; }
    .box-cyan { fill: #d9c9fe; stroke: #5e30eb; stroke-width: 1.5; }
    .label { fill: #1a2a40; }
    .sub { fill: #5070a0; }
    text { font-family: -apple-system, "Segoe UI", Helvetica, sans-serif; }
    .label { font-size: 13px; font-weight: 600; }
    .sub { font-size: 11px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: transparent; }
      .box { fill: #1a1e2a; stroke: #505050; }
      .box-accent { fill: #0d1e38; stroke: #2b5cb0; }
      .box-green { fill: #0a1a3a; stroke: #4a80d0; }
      .box-warm { fill: #221a10; stroke: #a06020; }
      .box-purple { fill: #222222; stroke: #666666; }
      .box-teal { fill: #1e1e1e; stroke: #666666; }
      .box-slate { fill: #0d1a38; stroke: #4a7ad0; }
      .box-indigo { fill: #1a2810; stroke: #5a8a30; }
      .box-rose { fill: #1a2810; stroke: #5aaa30; }
      .box-orange { fill: #2a1a08; stroke: #f97316; }
      .box-cyan { fill: #1a1030; stroke: #7040d0; }
      .label { fill: #d0daf0; }
      .sub { fill: #5070a0; }
    }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8z" fill="#5070a0" stroke="none"/>
    </marker>
    <marker id="ahs" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8z" fill="#3b82f6" stroke="none"/>
    </marker>
  </defs>
  <rect width="1388" height="202" class="bg" rx="8"/>

  <rect x="30" y="30" width="180" height="60" rx="8" class="box-rose"/>
  <text x="120" y="56" text-anchor="middle" class="label">Clojure Source</text>
  <text x="120" y="74" text-anchor="middle" class="sub">.joke files</text>

  <rect x="270" y="30" width="180" height="60" rx="8" class="box-purple"/>
  <text x="360" y="56" text-anchor="middle" class="label">Reader + Parser</text>
  <text x="360" y="74" text-anchor="middle" class="sub">AST · TCO rewrite</text>

  <rect x="510" y="30" width="180" height="60" rx="8" class="box-purple"/>
  <text x="600" y="56" text-anchor="middle" class="label">IR Compiler</text>
  <text x="600" y="74" text-anchor="middle" class="sub">45+ opcodes · scope analysis</text>

  <rect x="742" y="22" width="384" height="140" rx="12" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <rect x="844" y="30" width="180" height="60" rx="8" class="box-green"/>
  <text x="934" y="56" text-anchor="middle" class="label">Tiered Dispatch</text>
  <text x="934" y="74" text-anchor="middle" class="sub">per-instance fn cache</text>
  <rect x="758" y="98" width="82" height="48" rx="6" class="box-green"/>
  <text x="799" y="119" text-anchor="middle" class="label" style="font-size:11px">WASM</text>
  <text x="799" y="133" text-anchor="middle" class="sub" style="font-size:9px">native JIT</text>
  <rect x="848" y="98" width="82" height="48" rx="6" class="box-green"/>
  <text x="889" y="119" text-anchor="middle" class="label" style="font-size:11px">Typed IR</text>
  <text x="889" y="133" text-anchor="middle" class="sub" style="font-size:9px">irValue stack</text>
  <rect x="938" y="98" width="82" height="48" rx="6" class="box"/>
  <text x="979" y="119" text-anchor="middle" class="label" style="font-size:11px">Boxed IR</text>
  <text x="979" y="133" text-anchor="middle" class="sub" style="font-size:9px">transients</text>
  <rect x="1028" y="98" width="82" height="48" rx="6" class="box-slate"/>
  <text x="1069" y="119" text-anchor="middle" class="label" style="font-size:11px">Tree-walker</text>
  <text x="1069" y="133" text-anchor="middle" class="sub" style="font-size:9px">full semantics</text>

  <rect x="1178" y="30" width="180" height="60" rx="8" class="box-orange"/>
  <text x="1268" y="56" text-anchor="middle" class="label">Namespaces</text>
  <text x="1268" y="74" text-anchor="middle" class="sub">imaging · svg · pdf · jit</text>

  <rect x="1178" y="118" width="180" height="60" rx="8" class="box-cyan"/>
  <text x="1268" y="144" text-anchor="middle" class="label">joker.runtime</text>
  <text x="1268" y="162" text-anchor="middle" class="sub">introspection · profiling</text>

  <path d="M210,60 L270,60" fill="none" stroke="#5070a0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)"/>
  <path d="M450,60 L510,60" fill="none" stroke="#5070a0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)"/>
  <path d="M690,60 L844,60" fill="none" stroke="#5070a0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)"/>
  <text x="767" y="54" text-anchor="middle" class="sub">IRProgram</text>
  <path d="M1024,60 L1178,60" fill="none" stroke="#5070a0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)"/>
  <path d="M1358,148 L1087,148 Q1101,148 1101,134 L1101,74 Q1101,60 1115,60 L844,60" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ahs)"/>
  <text x="1101" y="54" text-anchor="middle" class="sub">inspect</text>

  <text x="694" y="198" text-anchor="middle" class="sub">go-joker execution pipeline — tiered dispatch with IR compilation</text>
</svg>