<svg xmlns="http://www.w3.org/2000/svg" width="1316" height="500" viewBox="0 0 1316 500">
<style>
:root{color-scheme:light dark;--bg:#f8f9fc;--panel:#fff;--text:#1a1f36;--muted:#6b7394;--grid:#e4e8f0;--bun:#f5a623;--python:#3572a5;--goja:#e8a04f;--joker:#23a566}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--text:#e6edf3;--muted:#8b949e;--grid:#30363d;--bun:#f5a623;--python:#6ba3d6;--goja:#e8a04f;--joker:#3fb950}}
svg{background:var(--bg);font-family:Inter,system-ui,sans-serif}
.title{fill:var(--text);font-size:18px;font-weight:700}
.label{fill:var(--muted);font-size:9px}
.val{fill:var(--text);font-size:8px;font-weight:500}
.grid{stroke:var(--grid);stroke-width:0.5}
.leg{fill:var(--text);font-size:11px}
</style>
