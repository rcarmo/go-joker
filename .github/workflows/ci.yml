name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  TMPDIR: ${{ github.workspace }}/.cache/tmp
  GOTMPDIR: ${{ github.workspace }}/.cache/go-build-tmp
  DOCS_JOKER_BIN: ${{ github.workspace }}/.cache/tmp/go-joker-docs

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare reproducible temp directories
        run: mkdir -p "$TMPDIR" "$GOTMPDIR"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
      - name: Build
        run: go build -o .cache/tmp/joker ./cmd/joker
      - name: Run tests
        run: go test ./core ./std/... ./cmd/joker ./internal/notebook -timeout 10m -count=1
      - name: Run notebook smoke checks
        run: make notebook-check
      - uses: oven-sh/setup-bun@v2
      - name: Install notebook browser smoke dependencies
        run: |
          bun install --frozen-lockfile
          PLAYWRIGHT_BROWSERS_PATH=${{ github.workspace }}/.cache/ms-playwright bunx playwright install chromium
      - name: Run notebook browser smoke check
        run: PLAYWRIGHT_BROWSERS_PATH=${{ github.workspace }}/.cache/ms-playwright make notebook-browser-smoke
      - name: Generate docs and verify namespace/feature coverage
        run: make docs-check
      - name: Run local parity suite
        run: go run tests/clojure_parity.go -joker .cache/tmp/joker -out docs/DIVERGENCE_MATRIX.md
      - name: Run imported jank smoke subset
        run: JOKER_BIN=.cache/tmp/joker tests/run_jank_subset.sh
      - name: Run vet
        run: go vet ./core ./std/... ./cmd/joker ./internal/notebook

  bench:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Prepare reproducible temp directories
        run: mkdir -p "$TMPDIR" "$GOTMPDIR"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'

      - name: Run VM microbenchmarks
        run: |
          go test ./benchmarks/core -bench 'BenchmarkCall|BenchmarkFib|BenchmarkTak|BenchmarkLoop|BenchmarkReduce|BenchmarkClosure|BenchmarkMap|BenchmarkVector|BenchmarkTransduce' \
            -benchmem -benchtime=1s -count=3 | tee bench-results.txt

      - name: Run CLBG benchmarks
        run: |
          go test ./benchmarks/core -bench 'BenchmarkCLBG' -benchmem -benchtime=3x -count=1 | tee -a bench-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results.txt
          retention-days: 7

      - name: Check benchmark smoke thresholds
        run: tests/benchmark_ci_check.sh bench-results.txt
