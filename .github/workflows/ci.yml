name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  TMPDIR: /tmp/go-joker
  GOTMPDIR: /tmp/go-joker
  DOCS_JOKER_BIN: /tmp/go-joker/go-joker-docs

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare reproducible temp directory
        run: mkdir -p "$TMPDIR"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
      - name: Build
        run: go build -o joker ./cmd/joker
      - name: Run tests
        run: go test ./core ./std/... -timeout 120s -count=1
      - name: Generate docs and verify namespace/feature coverage
        run: make docs-check
      - name: Run local parity suite
        run: go run tests/clojure_parity.go -joker ./joker -out docs/DIVERGENCE_MATRIX.md
      - name: Run imported jank smoke subset
        run: JOKER_BIN=./joker tests/run_jank_subset.sh
      - name: Run vet
        run: go vet ./core ./std/...

  bench:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Prepare reproducible temp directory
        run: mkdir -p "$TMPDIR"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Run VM microbenchmarks
        run: |
          go test ./core -bench 'BenchmarkCall|BenchmarkFib|BenchmarkTak|BenchmarkLoop|BenchmarkReduce|BenchmarkClosure|BenchmarkMap|BenchmarkVector|BenchmarkTransduce' \
            -benchmem -benchtime=1s -count=3 | tee bench-results.txt

      - name: Run CLBG benchmarks
        run: |
          go test ./core -bench 'BenchmarkCLBG' -benchmem -benchtime=3x -count=1 | tee -a bench-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results.txt
          retention-days: 90

      - name: Check benchmark smoke thresholds
        run: tests/benchmark_ci_check.sh bench-results.txt
