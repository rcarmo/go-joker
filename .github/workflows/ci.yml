name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
      - name: Build
        run: go build -o joker .
      - name: Run tests
        run: go test ./core ./std/... -timeout 120s -count=1
      - name: Run vet
        run: go vet ./core ./std/...

  bench:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Run VM microbenchmarks
        run: |
          go test ./core -bench 'BenchmarkCall|BenchmarkFib|BenchmarkTak|BenchmarkLoop|BenchmarkReduce|BenchmarkClosure|BenchmarkMap|BenchmarkVector|BenchmarkTransduce' \
            -benchmem -benchtime=1s -count=3 | tee bench-results.txt

      - name: Run CLBG benchmarks
        run: |
          go test ./core -bench 'BenchmarkCLBG' -benchmem -benchtime=3x -count=1 | tee -a bench-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results.txt
          retention-days: 90

      - name: Check for regressions (fib/tak/loop)
        run: |
          echo "=== Checking key benchmark thresholds ==="
          # Extract ns/op for key benchmarks and check against thresholds
          # These are generous thresholds (10x headroom) to catch major regressions only
          set -euo pipefail

          check_bench() {
            local name="$1"
            local max_ns="$2"
            local result
            result=$(grep "^${name}-" bench-results.txt | head -1 | awk '{print $3}' | tr -d ' ')
            if [ -z "$result" ]; then
              echo "SKIP: ${name} not found in results"
              return 0
            fi
            echo "${name}: ${result} ns/op (threshold: ${max_ns} ns/op)"
            # Compare as integers (truncate decimal)
            local ns_int=${result%.*}
            if [ "$ns_int" -gt "$max_ns" ]; then
              echo "FAIL: ${name} regression detected! ${ns_int} > ${max_ns}"
              return 1
            fi
          }

          # Thresholds based on current baseline + 5x headroom
          check_bench "BenchmarkFib10"        20000      # ~3.5µs baseline
          check_bench "BenchmarkFib20"        2000000    # ~257µs baseline
          check_bench "BenchmarkTak"          10000000   # ~1.1ms baseline
          check_bench "BenchmarkLoopRecur1M"  10000000   # ~1.0ms baseline
          echo "=== All threshold checks passed ==="
