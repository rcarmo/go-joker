name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  PROFILE_TESTS: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.7
      - name: Prepare reproducible temp directories
        run: |
          source scripts/project-env.sh
          for name in PROJECT_TMP_ROOT PROJECT_ORIGINAL_TMPDIR TMPDIR GOTMPDIR GOCACHE GOMODCACHE GOPATH GOBIN BUN_INSTALL_CACHE_DIR npm_config_cache PLAYWRIGHT_BROWSERS_PATH DOCS_JOKER_BIN; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Populate dependency cache for offline consumer checks
        run: go mod download
      - name: Build
        run: go build -o "$PROJECT_TMP_ROOT/build/joker" ./cmd/joker
      - name: Run canonical release checks
        run: make release-check
      - name: Test default no-cgo FFI and fluid solver
        run: make ffi-check
      - uses: oven-sh/setup-bun@v2
      - name: Install notebook browser smoke dependencies
        run: |
          bun install --frozen-lockfile
          PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" bunx playwright install chromium
      - name: Run notebook browser smoke check
        run: PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" make notebook-browser-smoke
      - name: Run local parity suite
        run: go run tests/clojure_parity.go -joker "$PROJECT_TMP_ROOT/build/joker" -out docs/DIVERGENCE_MATRIX.md
      - name: Run imported jank smoke subset
        run: JOKER_BIN="$PROJECT_TMP_ROOT/build/joker" tests/run_jank_subset.sh

  bench:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Prepare reproducible temp directories
        run: |
          source scripts/project-env.sh
          for name in PROJECT_TMP_ROOT PROJECT_ORIGINAL_TMPDIR TMPDIR GOTMPDIR GOCACHE GOMODCACHE GOPATH GOBIN BUN_INSTALL_CACHE_DIR npm_config_cache PLAYWRIGHT_BROWSERS_PATH DOCS_JOKER_BIN; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Run VM microbenchmarks
        run: |
          scripts/test-profile.sh ./benchmarks/core -- -bench 'BenchmarkCall|BenchmarkFib|BenchmarkTak|BenchmarkLoop|BenchmarkReduce|BenchmarkClosure|BenchmarkMap|BenchmarkVector|BenchmarkTransduce' \
            -benchmem -benchtime=1s -count=3 | tee bench-results.txt

      - name: Run CLBG benchmarks
        run: |
          scripts/test-profile.sh ./benchmarks/core -- -bench 'BenchmarkCLBG' -benchmem -benchtime=3x -count=1 | tee -a bench-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            bench-results.txt
            .cache/profile-conclusions/
          retention-days: 7

      - name: Check benchmark smoke thresholds
        run: tests/benchmark_ci_check.sh bench-results.txt
