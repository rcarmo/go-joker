name: Release

on:
  push:
    tags: ['v*']

permissions: {}

env:
  TMPDIR: ${{ github.workspace }}/.cache/tmp
  GOTMPDIR: ${{ github.workspace }}/.cache/go-build-tmp
  DOCS_JOKER_BIN: ${{ github.workspace }}/.cache/tmp/go-joker-docs

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare reproducible temp directories
        run: mkdir -p "$TMPDIR" "$GOTMPDIR"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Verify release tag matches the source version
        run: |
          version=$(sed -n 's/^const VERSION = "\(.*\)"/\1/p' core/runtime/version.go)
          test "$version" = "$GITHUB_REF_NAME"
      - name: Run canonical release checks
        run: make release-check
      - uses: oven-sh/setup-bun@v2
      - name: Install notebook browser smoke dependencies
        run: |
          bun install --frozen-lockfile
          PLAYWRIGHT_BROWSERS_PATH=${{ github.workspace }}/.cache/ms-playwright bunx playwright install chromium
      - name: Run notebook browser smoke check
        run: PLAYWRIGHT_BROWSERS_PATH=${{ github.workspace }}/.cache/ms-playwright make notebook-browser-smoke

  build:
    needs: test
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Prepare reproducible temp directories
        run: mkdir -p "$TMPDIR" "$GOTMPDIR"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Build
        id: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          binary="joker-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          go build -trimpath -ldflags="-s -w" -o "$binary" ./cmd/joker
          echo "binary=$binary" >> "$GITHUB_OUTPUT"

      - name: Stage binary for SBOM scan
        run: |
          mkdir sbom-input
          cp "${{ steps.build.outputs.binary }}" sbom-input/

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: sbom-input
          format: spdx-json
          output-file: ${{ steps.build.outputs.binary }}.spdx.json
          upload-artifact: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.build.outputs.binary }}

      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-path: ${{ steps.build.outputs.binary }}
          sbom-path: ${{ steps.build.outputs.binary }}.spdx.json

      - name: Upload binary and SBOM
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: joker-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          path: |
            ${{ steps.build.outputs.binary }}
            ${{ steps.build.outputs.binary }}.spdx.json

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Generate and verify release checksums
        run: tests/generate_release_checksums.sh release-files

      - name: Verify downloaded binaries and supply-chain assets
        env:
          TAG: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: tests/verify_release_assets.sh release-files "$TAG" "$REVISION"

      - name: Generate release notes
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          previous=$(git tag --sort=-v:refname | grep '^v' | grep -v "^${TAG}$" | head -1 || true)
          {
            echo "# go-joker ${TAG}"
            echo
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "## Binaries"
            echo
            find release-files -maxdepth 1 -type f -name 'joker-*' ! -name '*.spdx.json' -printf '%f\n' | LC_ALL=C sort | sed 's/^/- /'
            echo
            echo "## Verification"
            echo
            echo "- \`SHA256SUMS\` covers every binary and SPDX SBOM."
            echo "- Each binary has GitHub build-provenance and SBOM attestations."
            echo "- Verify an artifact with \`gh attestation verify <file> --repo ${REPO}\`."
            echo
            if [ -n "$previous" ]; then
              echo "## Changes since ${previous}"
              range="${previous}..${TAG}"
            else
              echo "## Changes"
              range="${TAG}"
            fi
            echo
            # Literal backticks belong in the generated Markdown.
            # shellcheck disable=SC2016
            git log --no-merges --date=short --pretty=format:'- \`%h\` %ad %s' "$range"
            echo
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "go-joker ${TAG}" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "go-joker ${TAG}" --notes-file release-notes.md
          fi
          gh release upload "$TAG" release-files/* --clobber
