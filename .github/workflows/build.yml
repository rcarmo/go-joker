name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  TMPDIR: ${{ github.workspace }}/.cache/tmp
  GOTMPDIR: ${{ github.workspace }}/.cache/go-build-tmp
  DOCS_JOKER_BIN: ${{ github.workspace }}/.cache/tmp/go-joker-docs

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare reproducible temp directories
        run: mkdir -p "$TMPDIR" "$GOTMPDIR"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
      - name: Run tests
        run: go test ./core ./std/... ./cmd/joker ./internal/notebook -timeout 10m -count=1
      - name: Run docs, examples, release hygiene, and contract checks
        run: make docs-check
      - uses: oven-sh/setup-bun@v2
      - name: Install notebook browser smoke dependencies
        run: |
          bun install --frozen-lockfile
          PLAYWRIGHT_BROWSERS_PATH=${{ github.workspace }}/.cache/ms-playwright bunx playwright install chromium
      - name: Run notebook browser smoke check
        run: PLAYWRIGHT_BROWSERS_PATH=${{ github.workspace }}/.cache/ms-playwright make notebook-browser-smoke

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Prepare reproducible temp directories
        run: mkdir -p "$TMPDIR" "$GOTMPDIR"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o joker-${{ matrix.goos }}-${{ matrix.goarch }}${ext} ./cmd/joker

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: joker-${{ matrix.goos }}-${{ matrix.goarch }}
          path: joker-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Generate release notes
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          previous=$(git tag --sort=-v:refname | grep '^v' | grep -v "^${TAG}$" | head -1 || true)
          {
            echo "# go-joker ${TAG}"
            echo
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "## Binaries"
            echo
            for f in release-files/joker-*; do
              echo "- $(basename "$f")"
            done
            echo
            if [ -n "$previous" ]; then
              echo "## Changes since ${previous}"
              range="${previous}..${TAG}"
            else
              echo "## Changes"
              range="${TAG}"
            fi
            echo
            git log --no-merges --date=short --pretty=format:'- \`%h\` %ad %s' "$range"
            echo
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "go-joker ${TAG}" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "go-joker ${TAG}" --notes-file release-notes.md
          fi
          gh release upload "$TAG" release-files/* --clobber
