name: Release

on:
  push:
    tags: ['v42.*']

permissions: {}

env:
  PROFILE_TESTS: 1

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare reproducible temp directories
        run: |
          source scripts/project-env.sh
          for name in PROJECT_TMP_ROOT PROJECT_ORIGINAL_TMPDIR TMPDIR GOTMPDIR GOCACHE GOMODCACHE GOPATH GOBIN BUN_INSTALL_CACHE_DIR npm_config_cache PLAYWRIGHT_BROWSERS_PATH DOCS_JOKER_BIN; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Verify release tag matches the source version
        run: |
          version=$(sed -n 's/^const VERSION = "\(.*\)"/\1/p' core/runtime/version.go)
          test "$version" = "$GITHUB_REF_NAME"
      - name: Populate dependency cache for offline consumer checks
        run: make deps
      - name: Run canonical release checks
        run: make release-check
      - name: Test default no-cgo FFI and fluid solver
        run: make ffi-check
      - uses: oven-sh/setup-bun@v2
      - name: Install notebook browser smoke dependencies
        run: |
          make browser-deps
      - name: Run notebook browser smoke check
        run: PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" make notebook-browser-smoke
      - name: Retain concise Go test conclusions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-conclusions-${{ github.job }}
          path: .cache/profile-conclusions/
          retention-days: 7


  build:
    needs: test
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Prepare reproducible temp directories
        run: |
          source scripts/project-env.sh
          for name in PROJECT_TMP_ROOT PROJECT_ORIGINAL_TMPDIR TMPDIR GOTMPDIR GOCACHE GOMODCACHE GOPATH GOBIN BUN_INSTALL_CACHE_DIR npm_config_cache PLAYWRIGHT_BROWSERS_PATH DOCS_JOKER_BIN; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Build
        id: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          binary="$PROJECT_TMP_ROOT/build/joker-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          make release-binary RELEASE_BINARY="$binary"
          echo "binary=$binary" >> "$GITHUB_OUTPUT"

      - name: Stage binary for SBOM scan
        run: |
          mkdir -p "$PROJECT_TMP_ROOT/runs/sbom-input"
          cp "${{ steps.build.outputs.binary }}" "$PROJECT_TMP_ROOT/runs/sbom-input/"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ${{ env.PROJECT_TMP_ROOT }}/runs/sbom-input
          format: spdx-json
          output-file: ${{ steps.build.outputs.binary }}.spdx.json
          upload-artifact: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.build.outputs.binary }}

      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-path: ${{ steps.build.outputs.binary }}
          sbom-path: ${{ steps.build.outputs.binary }}.spdx.json

      - name: Upload binary and SBOM
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: joker-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          path: |
            ${{ steps.build.outputs.binary }}
            ${{ steps.build.outputs.binary }}.spdx.json

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          # Test profiles are retained as separate diagnostic artifacts and must
          # never be mixed into published binaries/SBOMs/checksum input.
          pattern: joker-*
          path: release-files
          merge-multiple: true

      - name: Prepare reproducible temp directories
        run: |
          source scripts/project-env.sh
          for name in PROJECT_TMP_ROOT PROJECT_ORIGINAL_TMPDIR TMPDIR GOTMPDIR GOCACHE GOMODCACHE GOPATH GOBIN BUN_INSTALL_CACHE_DIR npm_config_cache PLAYWRIGHT_BROWSERS_PATH DOCS_JOKER_BIN; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Generate and verify release checksums
        run: make release-checksums RELEASE_ASSET_DIR=release-files

      - name: Verify downloaded binaries and supply-chain assets
        env:
          TAG: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: make release-assets-check RELEASE_ASSET_DIR=release-files

      - name: Verify default no-cgo FFI in downloaded binary
        run: make ffi-binary-check FFI_BINARY=release-files/joker-linux-amd64

      - name: Verify public Go module and CLI installation
        env:
          TAG: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
          GOPROXY: https://proxy.golang.org
        run: make public-module-check

      - name: Generate release notes
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          previous=$(git tag --sort=-v:refname | grep '^v' | grep -v "^${TAG}$" | head -1 || true)
          {
            echo "# go-joker ${TAG}"
            echo
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            if [ -f "docs/RELEASE_NOTES_${TAG}.md" ]; then
              tail -n +3 "docs/RELEASE_NOTES_${TAG}.md"
              echo
            fi
            echo "## Binaries"
            echo
            find release-files -maxdepth 1 -type f -name 'joker-*' ! -name '*.spdx.json' -printf '%f\n' | LC_ALL=C sort | sed 's/^/- /'
            echo
            echo "## Verification"
            echo
            echo "- \`SHA256SUMS\` covers every binary and SPDX SBOM."
            echo "- Each binary has GitHub build-provenance and SBOM attestations."
            echo "- Verify an artifact with \`gh attestation verify <file> --repo ${REPO}\`."
            echo
            if [ -n "$previous" ]; then
              echo "## Changes since ${previous}"
              range="${previous}..${TAG}"
            else
              echo "## Changes"
              range="${TAG}"
            fi
            echo
            # Literal backticks belong in the generated Markdown.
            # shellcheck disable=SC2016
            git log --no-merges --date=short --pretty=format:'- \`%h\` %ad %s' "$range"
            echo
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "go-joker ${TAG}" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "go-joker ${TAG}" --notes-file release-notes.md
          fi
          gh release upload "$TAG" release-files/* --clobber
