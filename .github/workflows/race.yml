name: Race stress

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  TMPDIR: ${{ github.workspace }}/.cache/tmp
  GOTMPDIR: ${{ github.workspace }}/.cache/go-build-tmp

jobs:
  race-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare reproducible temp directories
        run: mkdir -p "$TMPDIR" "$GOTMPDIR"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Run repeated shuffled race coverage
        run: make race-stress
